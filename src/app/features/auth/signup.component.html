<div class="auth-container">
  @if (confirmed()) {
    <h1 class="auth-title">Check Your Email</h1>
    <p class="auth-confirm-msg">
      We sent a confirmation link to <strong>{{ email() }}</strong>.<br />
      Click the link to activate your account.
    </p>
    <p class="auth-switch">Already confirmed? <a routerLink="/login">Sign in</a></p>
  } @else {
    <h1 class="auth-title">Create Account</h1>

    @if (error()) {
      <p class="auth-error">{{ error() }}</p>
    }

    <form class="auth-form" (ngSubmit)="onSubmit()">
      <div class="field">
        <label class="field-label">Username</label>
        <input class="field-input" type="text" [ngModel]="username()" (ngModelChange)="username.set($event)" name="username" required />
      </div>
      <div class="field">
        <label class="field-label">Email</label>
        <input class="field-input" type="email" [ngModel]="email()" (ngModelChange)="email.set($event)" name="email" required />
      </div>
      <div class="field">
        <label class="field-label">Password</label>
        <input class="field-input" type="password" [ngModel]="password()" (ngModelChange)="password.set($event)" name="password" required minlength="6" />
      </div>
      <button class="auth-btn" type="submit" [disabled]="loading()">
        {{ loading() ? 'Creating account...' : 'Create Account' }}
      </button>
    </form>

    <p class="auth-switch">Have an account? <a routerLink="/login">Sign in</a></p>
  }
</div>
