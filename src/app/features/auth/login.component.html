<div class="auth-container">
  <h1 class="auth-title">Sign In</h1>

  @if (error()) {
    <p class="auth-error">{{ error() }}</p>
  }

  <form class="auth-form" (ngSubmit)="onSubmit()">
    <div class="field">
      <label class="field-label">Email</label>
      <input class="field-input" type="email" [ngModel]="email()" (ngModelChange)="email.set($event)" name="email" required />
    </div>
    <div class="field">
      <label class="field-label">Password</label>
      <input class="field-input" type="password" [ngModel]="password()" (ngModelChange)="password.set($event)" name="password" required />
    </div>
    <button class="auth-btn" type="submit" [disabled]="loading()">
      {{ loading() ? 'Signing in...' : 'Sign In' }}
    </button>
  </form>

  <p class="auth-switch">No account? <a routerLink="/signup">Sign up</a></p>
</div>
